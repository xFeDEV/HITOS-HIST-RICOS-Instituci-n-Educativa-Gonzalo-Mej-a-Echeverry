<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260">
  <defs>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4EFE4" stop-opacity="1"/>
      <stop offset="18%" stop-color="#F4EFE4" stop-opacity="0.25"/>
      <stop offset="88%" stop-color="#F4EFE4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F4EFE4" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE4" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#F4EFE4" stop-opacity="0"/>
      <stop offset="82%" stop-color="#F4EFE4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F4EFE4" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Subtle distant mountains of Altagracia -->
  <path d="M80 185 Q210 120 350 155 T640 130 T760 155 L760 250 L80 250 Z" fill="#C8C0AD" opacity="0.28"/>

  <!-- Heritage Tree on the Left (etching style) -->
  <g stroke="#4E5346" fill="none" opacity="0.78">
    <!-- Trunk and main branches -->
    <path d="M185 235 C186 195 182 155 178 115 C155 82 110 55 68 42" stroke-width="8" stroke-linecap="round"/>
    <path d="M182 135 C208 98 255 65 305 45" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M179 115 C175 72 192 38 220 12" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M145 92 C125 65 95 45 55 30" stroke-width="4" stroke-linecap="round"/>
    <path d="M225 88 C255 65 290 52 325 48" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Stippled / sketched foliage clusters -->
  <g fill="#575D4E" opacity="0.52">
    <ellipse cx="115" cy="48" rx="68" ry="32"/>
    <ellipse cx="195" cy="28" rx="78" ry="34"/>
    <ellipse cx="275" cy="46" rx="65" ry="28"/>
    <ellipse cx="75" cy="72" rx="48" ry="22"/>
    <ellipse cx="160" cy="68" rx="55" ry="24"/>
    <ellipse cx="245" cy="72" rx="52" ry="22"/>
  </g>
  <g fill="#3E4437" opacity="0.38">
    <ellipse cx="135" cy="42" rx="45" ry="20"/>
    <ellipse cx="215" cy="36" rx="50" ry="22"/>
    <ellipse cx="285" cy="54" rx="42" ry="18"/>
  </g>

  <!-- Perspective Rural School Building (Right side, matching reference image) -->
  <g stroke="#4A4F42" fill="none" opacity="0.82">
    <!-- Left small pavilion behind tree -->
    <polygon points="118,182 158,164 198,182" fill="#D5CEBD" stroke-width="1.5"/>
    <rect x="125" y="182" width="66" height="46" fill="#E9E3D4" stroke-width="1.5"/>
    <rect x="148" y="196" width="18" height="32" fill="#5A5F51"/>

    <!-- Long Perspective Roof of Main School Wing -->
    <polygon points="220,148 735,48 755,66 235,160" fill="#CFC7B4" stroke="#4A4F42" stroke-width="1.8"/>
    <!-- Roof eaves line -->
    <line x1="220" y1="154" x2="750" y2="58" stroke="#3D4236" stroke-width="2.2"/>
    <line x1="230" y1="160" x2="752" y2="66" stroke="#5A5F51" stroke-width="1.5"/>

    <!-- Perspective Back Wall of Corridor -->
    <polygon points="245,160 745,68 745,215 245,228" fill="#E8E1D1" stroke="#4A4F42" stroke-width="1.5"/>
    <!-- Lower Wainscot (Zócalo) -->
    <polygon points="245,204 745,168 745,215 245,228" fill="#787D6E" opacity="0.55"/>

    <!-- Windows in perspective along the school wall -->
    <polygon points="295,162 342,154 342,192 295,196" fill="#555B4C" opacity="0.75"/>
    <polygon points="368,150 422,140 422,184 368,190" fill="#555B4C" opacity="0.75"/>
    <polygon points="452,135 512,124 512,174 452,181" fill="#555B4C" opacity="0.75"/>
    <polygon points="545,118 615,105 615,162 545,170" fill="#555B4C" opacity="0.75"/>
    <polygon points="648,98 725,84 725,148 648,158" fill="#555B4C" opacity="0.75"/>

    <!-- Window panes grid lines -->
    <g stroke="#E8E1D1" stroke-width="1.1" opacity="0.8">
      <line x1="318" y1="158" x2="318" y2="194"/>
      <line x1="395" y1="145" x2="395" y2="187"/>
      <line x1="482" y1="130" x2="482" y2="178"/>
      <line x1="580" y1="112" x2="580" y2="166"/>
      <line x1="686" y1="91" x2="686" y2="153"/>
    </g>

    <!-- Corridor Pillars in Foreground (increasing height to the right in perspective) -->
    <g fill="#F2ECE0" stroke="#4A4F42" stroke-width="1.6">
      <rect x="272" y="154" width="7" height="74"/>
      <rect x="348" y="140" width="8" height="86"/>
      <rect x="430" y="125" width="9" height="100"/>
      <rect x="522" y="108" width="11" height="115"/>
      <rect x="625" y="90" width="13" height="130"/>
      <rect x="732" y="70" width="14" height="148"/>
    </g>

    <!-- Ground & Bushes in Courtyard -->
    <path d="M60 232 L760 215" stroke="#5A5F51" stroke-width="1.5"/>
    <g fill="#686E5E" opacity="0.55">
      <ellipse cx="215" cy="226" rx="28" ry="10"/>
      <ellipse cx="435" cy="222" rx="24" ry="9"/>
      <ellipse cx="530" cy="220" rx="30" ry="11"/>
      <ellipse cx="640" cy="218" rx="35" ry="12"/>
    </g>
  </g>

  <!-- Soft blending masks so it merges seamlessly with the ivory header -->
  <rect width="760" height="260" fill="url(#fadeLeft)"/>
  <rect width="760" height="260" fill="url(#fadeBottom)"/>
</svg>
